name = "everpeak-internal"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Create this with: wrangler d1 create everpeak-internal-db
# Then paste the database_id it gives you below.
[[d1_databases]]
binding = "DB"
database_name = "everpeak-internal-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Route your custom domain / subdomain to this Worker.
# Update the zone_name to your actual domain in the Cloudflare dashboard,
# or manage this route from Workers & Pages > your worker > Settings > Domains & Routes.
[[routes]]
pattern = "int.everpeakvisuals.com/*"
zone_name = "everpeakvisuals.com"

[observability]
enabled = true
